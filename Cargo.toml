[workspace]
resolver = "2"
members = [
    "sinkd-reflect-sys",
    "sinkd-reflect",
    "sinkd-proto",
    "sinkd-core",
    "sinkd-client",
    "sinkd-server",
    "scenario",
]

[workspace.package]
authors = ["Tony <krakjn@gmail.com>"]
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/octo-works/sinkd"
readme = "README.md"
keywords = ["sync", "libreflect", "zenoh", "filesystem"]
categories = ["filesystem"]
rust-version = "1.100"

[workspace.dependencies]
log = { version = "0.4", features = ["std"] }
serde = { version = "1.0", features = ["derive"] }
toml = "0.9"
clap = { version = "4", features = ["derive"] }
zenoh = { version = "1.7.2", features = ["transport_tls"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time", "sync", "io-util", "signal", "fs"] }
postcard = { version = "1", features = ["alloc"] }
env_logger = "0.11"

[workspace.lints.rust]
warnings = { level = "deny", priority = -1 }
unused = { level = "deny", priority = -1 }
unsafe_code = "allow"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
correctness = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
complexity = { level = "deny", priority = -1 }
perf = { level = "deny", priority = -1 }
style = { level = "deny", priority = -1 }

multiple_crate_versions = "allow"

module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
doc_markdown = "allow"
similar_names = "allow"
items_after_statements = "allow"
struct_field_names = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"

needless_pass_by_value = "allow"
too_many_arguments = "allow"
too_many_lines = "allow"
unnecessary_wraps = "allow"

[profile.release]
strip = true
lto = true
opt-level = 2
panic = "abort"
codegen-units = 1
