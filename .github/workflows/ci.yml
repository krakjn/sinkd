name: ci

on:
  pull_request:
  push:
    tags: ["*"]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            platform: linux-x86_64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            platform: linux-arm64
          - os: macos-15
            target: aarch64-apple-darwin
            platform: macos-arm64
          ## GitHub charges an arm and a leg for this
          # - os: macos-15-intel
          #   target: x86_64-apple-darwin
          #   platform: macos-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: krakjn/bump@v9

      - name: Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            musl-tools clang libclang-dev pkg-config dpkg-dev

      # bindgen needs libclang. The Xcode toolchain has it; Homebrew llvm is not required.
      - name: macOS libclang
        if: runner.os == 'macOS'
        run: echo "LIBCLANG_PATH=$(xcode-select -p)/Toolchains/XcodeDefault.xctoolchain/usr/lib" >> "$GITHUB_ENV"

      - name: libreflect
        run: curl -fsSL https://reflect.ballast.dev/install.sh | sh

      - uses: dtolnay/rust-toolchain@1.100.0
        with:
          targets: ${{ matrix.target }}
          components: clippy

      # .cargo/config.toml defaults to x86_64 musl, so every cargo command passes --target.
      # Build the bins first so the scenario test does not spawn a nested cargo.
      - name: clippy
        run: cargo clippy --all-targets --workspace --target ${{ matrix.target }} -- -D warnings

      - name: build bins for scenario
        run: cargo build -p sinkd -p sinkd-srv --target ${{ matrix.target }}

      - name: test
        run: cargo test --workspace --target ${{ matrix.target }}

      - name: build
        run: cargo build -p sinkd -p sinkd-srv --release --locked --target ${{ matrix.target }}

      - name: package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          bin="target/${{ matrix.target }}/release"
          stage=$(mktemp -d)
          cp "$bin/sinkd" "$bin/sinkd-srv" pkg/man/sinkd.1 pkg/man/sinkd-srv.1 "$stage/"
          tar -C "$stage" -czf "dist/sinkd-${{ matrix.platform }}.tar.gz" sinkd sinkd-srv sinkd.1 sinkd-srv.1
          rm -rf "$stage"
          if [[ "$(uname -s)" == Linux ]]; then
            bash pkg/debian/create.sh
            cp pkg/artifacts/*.deb dist/
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: checksums and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd dist
          sha256sum -- * > SHA256SUMS
          gh release create "$GITHUB_REF_NAME" --generate-notes -- *

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build, release]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: checksums
        run: |
          set -euo pipefail
          cd dist
          sha256sum -- * > SHA256SUMS
          printf '%s\n' "$GITHUB_SHA" > COMMIT
          deb=$(echo sinkd_*_amd64.deb)
          if [ ! -f "$deb" ]; then
            echo "amd64 deb missing; cannot write VERSION" >&2
            exit 1
          fi
          ver=${deb#sinkd_}
          ver=${ver%_amd64.deb}
          printf '%s\n' "$ver" > VERSION

      - name: site
        run: bash scripts/prepare-site.sh

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  # deploy-pages lists artifacts as soon as it starts. In the same job as the
  # upload, that list often misses github-pages (actions/deploy-pages#451).
  deploy:
    if: startsWith(github.ref, 'refs/tags/')
    needs: publish
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
