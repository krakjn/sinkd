[package]
name = "sinkd"
version = "0.5.0"
description = "sinkd watch client"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true
publish = false

[lib]
name = "sinkd_client"
path = "src/lib.rs"

[[bin]]
name = "sinkd"
path = "src/main.rs"

[dependencies]
clap.workspace = true
env_logger.workspace = true
log.workspace = true
notify = "8"
notify-debouncer-full = "0.5"
sinkd-core = { path = "../sinkd-core" }
sinkd-proto = { path = "../sinkd-proto" }
sinkd-reflect = { path = "../sinkd-reflect" }
tokio.workspace = true
zenoh.workspace = true

[lints]
workspace = true
