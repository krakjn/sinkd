# Single container: server + one client (alice), SSH rsync via localhost.
name: sinkd-compose-1c

services:
  sinkd:
    build:
      context: ../..
      dockerfile: scenario/compose/Dockerfile
    image: sinkd-compose:latest
    hostname: sinkd
    environment:
      ROLE: server-client
      USER: server
      USER_NAME: alice
      WATCH: /watch_alice
      SINKD_SERVER_ADDR: sinkd
      SSH_PEERS: "sinkd"
    volumes:
      - srv-data:/srv/sinkd
      - alice-watch:/watch_alice
      - ${SINKD_SSH_DIR}:/run/sinkd-ssh:ro
    networks: [sinkd]

volumes:
  srv-data: {}
  alice-watch: {}

networks:
  sinkd:
    driver: bridge
