# sinkd system configuration (multi-user)
# see "/var/log/sinkd.log" to view logs

## server_addr can be:
## 1 - hostname of remote machine 
## 2 - IP address of remote machine 
## 3 - root path of local machine  (must be absolute and start with '/')
server_addr = "cerberus"

# each user will have their own configuration
users = [
  "alice",
  "bob",
  "tony"
]

# TODO: all global flags to be overwritten by share or anchor
# [rsync]
# # gloabl rsync defaults used
# compress = false
# partial = true
# bwlimit = "8m"

[[shares]]
path = "home/share/"
users = ["tony", "alice"]
interval = 5
excludes = ["temp", "*.pyc"]

[[shares]]
path = "path/to/share/folder2"
users = ["bob", "alice"]
interval = 5
excludes = ["drawings/", "*.png"]

[[anchors]]
path = "/Users/tony/dmz"
interval = 5
excludes = ["tmp/", "*.cache"]
rsync_options = {
  compress = false,
  partial = true,
  stats = false,
}