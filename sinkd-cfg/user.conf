# sinkd user configuration

[rsync]
# Optional global defaults for this user's configuration
compress = false
partial = true
stats = false

# directories to watch
[[anchors]]
path = "path/to/dir"
interval = 5  # in seconds
excludes = [
  "first_dir", 
  "second_dir"
]

[[anchors]]
path = "/Users/tony/dmz"
interval = 1 # in secs (minute for default)
excludes = [
    "dir1",
    "dir2"
] 

